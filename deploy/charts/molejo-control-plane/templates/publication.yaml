{{- if .Values.public.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: control-plane-console
  namespace: molejo-control-plane
  labels:
    app.kubernetes.io/name: control-plane-console
    app.kubernetes.io/part-of: molejo-platform
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ required "public.gateway.namespace is required" .Values.public.gateway.namespace | quote }}
      name: {{ required "public.gateway.name is required" .Values.public.gateway.name | quote }}
      sectionName: {{ required "public.gateway.sectionName is required" .Values.public.gateway.sectionName | quote }}
  hostnames:
    - {{ required "public.host is required" .Values.public.host | quote }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: console-web
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
