apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: molejo-control-plane
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: molejo-platform
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: molejo-control-plane
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: molejo-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: molejo-platform
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
          imagePullPolicy: IfNotPresent
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: molejo-control-plane-db, key: database }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: molejo-control-plane-db, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: molejo-control-plane-db, key: password }
          ports:
            - { name: postgres, containerPort: 5432, protocol: TCP }
          readinessProbe:
            exec: { command: ["sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: molejo-platform
      spec:
        accessModes: ["ReadWriteOnce"]
        volumeMode: Filesystem
        resources:
          requests:
            storage: 2Gi
