services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: molejo
      POSTGRES_PASSWORD: molejo
      POSTGRES_DB: molejo
    ports:
      - "127.0.0.1:${MOLEJO_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U molejo -d molejo"]
      interval: 2s
      timeout: 2s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
