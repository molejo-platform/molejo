services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: fruto
      POSTGRES_PASSWORD: fruto
      POSTGRES_DB: fruto
    ports:
      - "127.0.0.1:${FRUTO_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fruto -d fruto"]
      interval: 2s
      timeout: 2s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
