apiVersion: v1
kind: Secret
metadata:
  name: molejo-github-app
  namespace: fruto-control-plane
type: Opaque
stringData:
  GITHUB_APP_ID: "CHANGE_ME"
  GITHUB_APP_CLIENT_ID: "CHANGE_ME"
  GITHUB_APP_SLUG: molejo-platform-test
  client-secret: CHANGE_ME
  private-key.pem: |
    -----BEGIN RSA PRIVATE KEY-----
    CHANGE_ME
    -----END RSA PRIVATE KEY-----
# Apply a real Secret out of band. This example is intentionally excluded from
# kustomization and must never contain real credentials.
