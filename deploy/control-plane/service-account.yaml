apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane-api
  namespace: fruto-control-plane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane-runtime-worker
  namespace: fruto-control-plane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane-parameter-worker
  namespace: fruto-control-plane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane-delivery-worker
  namespace: fruto-control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-runtime
  namespace: fruto-workspaces
  annotations:
    platform.fruto.calouro.tech/control-plane-owner: fruto-control-plane
  labels:
    app.kubernetes.io/managed-by: fruto-control-plane
rules:
  - apiGroups: ["platform.fruto.calouro.tech"]
    resources: ["appdeployments", "appvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["platform.fruto.calouro.tech"]
    resources: ["appdeployments/status", "appvolumes/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-runtime
  namespace: fruto-workspaces
  annotations:
    platform.fruto.calouro.tech/control-plane-owner: fruto-control-plane
  labels:
    app.kubernetes.io/managed-by: fruto-control-plane
subjects:
  - kind: ServiceAccount
    name: control-plane-runtime-worker
    namespace: fruto-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane-runtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: control-plane-workspace-preflight
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["fruto-workspaces", "kube-system"]
    verbs: ["get"]
  # Kubernetes RBAC cannot constrain namespace create by resourceName because
  # the object does not exist yet. The API derives and validates the exact name
  # and refuses to adopt an unmarked Namespace.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: control-plane-workspace-preflight
subjects:
  - kind: ServiceAccount
    name: control-plane-runtime-worker
    namespace: fruto-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: control-plane-workspace-preflight
