apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane-api
  namespace: fruto-control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-appdeployments
  namespace: fruto-workspaces
rules:
  - apiGroups: ["platform.fruto.calouro.tech"]
    resources: ["appdeployments"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["platform.fruto.calouro.tech"]
    resources: ["appdeployments/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-appdeployments
  namespace: fruto-workspaces
subjects:
  - kind: ServiceAccount
    name: control-plane-api
    namespace: fruto-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane-appdeployments
