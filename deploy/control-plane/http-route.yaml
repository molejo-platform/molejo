apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: control-plane-console
  namespace: fruto-control-plane
  labels:
    app.kubernetes.io/name: control-plane-console
    app.kubernetes.io/part-of: fruto-platform
spec:
  parentRefs:
    - name: fruto
      namespace: fruto-system
      sectionName: https-molejo
  hostnames:
    - cloud.molejo.dev
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: control-plane-api
          port: 8080
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: console-web
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: control-plane-redirect
  namespace: fruto-control-plane
  labels:
    app.kubernetes.io/name: control-plane-redirect
    app.kubernetes.io/part-of: fruto-platform
spec:
  parentRefs:
    - name: fruto
      namespace: fruto-system
      sectionName: http
  hostnames:
    - cloud.molejo.dev
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
