apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: control-plane-console
  namespace: molejo-control-plane
  labels:
    app.kubernetes.io/name: control-plane-console
    app.kubernetes.io/part-of: molejo-platform
spec:
  parentRefs:
    - name: molejo
      namespace: molejo-system
      sectionName: https-molejo
  hostnames:
    - cloud.molejo.dev
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
        - path: { type: PathPrefix, value: /agent }
      backendRefs:
        - name: control-plane-api
          port: 8080
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: console-web
          port: 8080
