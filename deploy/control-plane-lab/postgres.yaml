apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fruto-control-plane
  annotations:
    molejo.dev/disposable: "true"
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fruto-control-plane-postgres
  namespace: fruto-control-plane
  annotations:
    molejo.dev/disposable: "true"
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: fruto-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: fruto-platform
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: fruto-data-01
      tolerations:
        - key: fruto.cleidsonoliveira.dev/workload
          operator: Equal
          value: data
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: docker.io/library/postgres@sha256:b86568d3e0fe1dfaeff52714f9da36f206a30e4c49131b82bf96982d78627409
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: fruto-control-plane-postgres, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: fruto-control-plane-postgres, key: password }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: fruto-control-plane-postgres, key: database }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [{ name: postgres, containerPort: 5432, protocol: TCP }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "fruto", "-d", "fruto"] }
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "fruto", "-d", "fruto"] }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          molejo.dev/disposable: "true"
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: molejo-platform-local
        resources:
          requests:
            storage: 2Gi
