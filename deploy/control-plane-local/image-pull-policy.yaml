apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-api
  namespace: fruto-control-plane
spec:
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-web
  namespace: fruto-control-plane
spec:
  template:
    spec:
      containers:
        - name: web
          imagePullPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  name: control-plane-migrate
  namespace: fruto-control-plane
spec:
  template:
    spec:
      containers:
        - name: migrate
          imagePullPolicy: Never
