apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-api
  namespace: fruto-control-plane
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: GITHUB_WEBHOOK_SECRET_FILE
              value: ""
            - name: FRUTO_PASSWORD_RESET_KEY_FILE
              value: ""
            - name: FRUTO_TOTP_ENABLED
              value: "false"
      volumes:
        - name: github-webhook
          secret: { secretName: molejo-github-webhook, optional: true }
        - name: openbao-ca
          configMap: { name: openbao-ca, optional: true }
        - name: parameter-fingerprint
          secret: { secretName: fruto-parameter-fingerprint, optional: true }
        - name: password-reset
          secret: { secretName: molejo-password-reset, optional: true }
        - name: observability-reader
          secret: { secretName: molejo-observability-reader, optional: true }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-runtime-worker
  namespace: fruto-control-plane
spec:
  template:
    spec:
      volumes:
        - name: openbao-ca
          configMap: { name: openbao-ca, optional: true }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-parameter-worker
  namespace: fruto-control-plane
spec:
  template:
    spec:
      volumes:
        - name: openbao-ca
          configMap: { name: openbao-ca, optional: true }
