receivers:
  k8s_cluster:
    auth_type: serviceAccount
    collection_interval: 30s
    metrics:
      k8s.container.restarts:
        enabled: true
      k8s.deployment.available:
        enabled: true
      k8s.deployment.desired:
        enabled: true
  k8s_events:
    auth_type: serviceAccount
  prometheus/platform:
    config:
      scrape_configs:
        - job_name: otel-collectors
          scrape_interval: 30s
          static_configs:
            - targets:
                - 127.0.0.1:8888
                - otel-gateway.molejo-observability.svc:8888
processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 192
    spike_limit_mib: 48
  filter/runtime:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["k8s.namespace.name"] != "fruto-workspaces"'
    metrics:
      datapoint:
        - 'resource.attributes["k8s.namespace.name"] != "fruto-workspaces"'
  batch:
    send_batch_size: 512
    timeout: 2s
exporters:
  otlp:
    endpoint: otel-gateway.molejo-observability.svc:4317
    tls: { insecure: true }
    retry_on_failure: { enabled: true, max_elapsed_time: 5m }
    sending_queue: { enabled: true, queue_size: 2048 }
service:
  telemetry:
    logs: { level: info }
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    metrics:
      receivers: [k8s_cluster]
      processors: [memory_limiter, filter/runtime, batch]
      exporters: [otlp]
    logs:
      receivers: [k8s_events]
      processors: [memory_limiter, filter/runtime, batch]
      exporters: [otlp]
    metrics/platform:
      receivers: [prometheus/platform]
      processors: [memory_limiter, batch]
      exporters: [otlp]
