apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-log-schema-migrate
  namespace: molejo-observability
  labels:
    app.kubernetes.io/name: clickhouse-log-schema-migrate
    app.kubernetes.io/part-of: molejo-observability
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse-log-schema-migrate
        app.kubernetes.io/part-of: molejo-observability
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: clickhouse/clickhouse-server@sha256:4ff0d6c199a9ebb906af75ae406496e8a96edd0187afdc16d51c0fb77ffca588
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: required-external-observability-credentials-secret, key: ingest-password } }
          command: [sh, -ec]
          args:
            - |
              query() {
                clickhouse-client --host clickhouse.molejo-observability.svc --user molejo_ingest --password "$CLICKHOUSE_PASSWORD" --query "$1"
              }
              attempt=0
              until [ "$(query 'EXISTS TABLE otel.otel_logs')" = "1" ]; do
                attempt=$((attempt + 1))
                [ "$attempt" -lt 120 ] || exit 1
                sleep 2
              done
              if [ "$(query "SELECT count() FROM system.columns WHERE database = 'otel' AND table = 'otel_logs' AND name = 'MolejoLogId'")" = "0" ]; then
                query "ALTER TABLE otel.otel_logs ADD COLUMN MolejoLogId UUID DEFAULT generateUUIDv4()"
                query "ALTER TABLE otel.otel_logs MATERIALIZE COLUMN MolejoLogId SETTINGS mutations_sync = 2"
              fi
              if [ "$(query "SELECT count() FROM system.columns WHERE database = 'otel' AND table = 'otel_logs' AND name = 'MolejoIngestedAt'")" = "0" ]; then
                query "ALTER TABLE otel.otel_logs ADD COLUMN MolejoIngestedAt DateTime64(9) DEFAULT now64(9)"
                query "ALTER TABLE otel.otel_logs MATERIALIZE COLUMN MolejoIngestedAt SETTINGS mutations_sync = 2"
              fi
              if [ "$(query "SELECT count() FROM system.columns WHERE database = 'otel' AND table = 'otel_logs' AND name = 'MolejoNamespace'")" = "0" ]; then
                query "ALTER TABLE otel.otel_logs ADD COLUMN MolejoNamespace LowCardinality(String) MATERIALIZED ResourceAttributes['k8s.namespace.name']"
                query "ALTER TABLE otel.otel_logs MATERIALIZE COLUMN MolejoNamespace SETTINGS mutations_sync = 2"
              fi
              runtime_changed=0
              runtime_expression="$(query "SELECT default_expression FROM system.columns WHERE database = 'otel' AND table = 'otel_logs' AND name = 'MolejoRuntime' FORMAT TSVRaw")"
              desired_runtime_expression="ResourceAttributes['molejo.app_environment.runtime']"
              if [ -z "$runtime_expression" ]; then
                query "ALTER TABLE otel.otel_logs ADD COLUMN MolejoRuntime LowCardinality(String) MATERIALIZED ResourceAttributes['molejo.app_environment.runtime']"
                query "ALTER TABLE otel.otel_logs MATERIALIZE COLUMN MolejoRuntime SETTINGS mutations_sync = 2"
                runtime_changed=1
              elif [ "$runtime_expression" != "$desired_runtime_expression" ]; then
                query "ALTER TABLE otel.otel_logs MODIFY COLUMN MolejoRuntime LowCardinality(String) MATERIALIZED ResourceAttributes['molejo.app_environment.runtime']"
                query "ALTER TABLE otel.otel_logs MATERIALIZE COLUMN MolejoRuntime SETTINGS mutations_sync = 2"
                runtime_changed=1
              fi
              if [ "$(query "SELECT count() FROM system.data_skipping_indices WHERE database = 'otel' AND table = 'otel_logs' AND name = 'MolejoNamespaceIndex'")" = "0" ]; then
                query "ALTER TABLE otel.otel_logs ADD INDEX MolejoNamespaceIndex MolejoNamespace TYPE set(100) GRANULARITY 1"
                query "ALTER TABLE otel.otel_logs MATERIALIZE INDEX MolejoNamespaceIndex SETTINGS mutations_sync = 2"
              fi
              materialize_runtime_index="$runtime_changed"
              if [ "$(query "SELECT count() FROM system.data_skipping_indices WHERE database = 'otel' AND table = 'otel_logs' AND name = 'MolejoRuntimeIndex'")" = "0" ]; then
                materialize_runtime_index=1
              fi
              if [ "$materialize_runtime_index" = "0" ] && [ "$(query "SELECT count() FROM system.mutations WHERE database = 'otel' AND table = 'otel_logs' AND command = '(MATERIALIZE COLUMN MolejoRuntime)' AND is_done = 1 AND create_time > (SELECT max(create_time) FROM system.mutations WHERE database = 'otel' AND table = 'otel_logs' AND command = '(MATERIALIZE INDEX MolejoRuntimeIndex)' AND is_done = 1)")" != "0" ]; then
                materialize_runtime_index=1
              fi
              if [ "$materialize_runtime_index" = "1" ]; then
                query "ALTER TABLE otel.otel_logs DROP INDEX IF EXISTS MolejoRuntimeIndex"
                query "ALTER TABLE otel.otel_logs ADD INDEX MolejoRuntimeIndex MolejoRuntime TYPE set(100) GRANULARITY 1"
                query "ALTER TABLE otel.otel_logs MATERIALIZE INDEX MolejoRuntimeIndex SETTINGS mutations_sync = 2"
              fi
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
