apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: molejo-observability
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: molejo-observability
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-gateway
  namespace: molejo-observability
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: otel-gateway } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchExpressions: [{ key: app.kubernetes.io/name, operator: In, values: [otel-agent, otel-cluster] }] }
      ports: [{ protocol: TCP, port: 4317 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse } } }]
      ports: [{ protocol: TCP, port: 9000 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: victoria-metrics } } }]
      ports: [{ protocol: TCP, port: 8428 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telemetry-collectors
  namespace: molejo-observability
spec:
  podSelector:
    matchExpressions: [{ key: app.kubernetes.io/name, operator: In, values: [otel-agent, otel-cluster] }]
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: otel-gateway } } }]
      ports: [{ protocol: TCP, port: 4317 }]
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
        - { protocol: TCP, port: 10250 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse
  namespace: molejo-observability
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: otel-gateway } } }]
      ports: [{ protocol: TCP, port: 9000 }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: fruto-control-plane } }
          podSelector: { matchLabels: { app.kubernetes.io/name: control-plane-api } }
      ports: [{ protocol: TCP, port: 8123 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victoria-metrics
  namespace: molejo-observability
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: victoria-metrics } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: otel-gateway } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: fruto-control-plane } }
          podSelector: { matchLabels: { app.kubernetes.io/name: control-plane-api } }
      ports: [{ protocol: TCP, port: 8428 }]
