apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: molejo-observability
data:
  retention.xml: |
    <clickhouse>
      <logger><level>information</level><console>true</console></logger>
      <listen_host>::</listen_host>
      <max_server_memory_usage_to_ram_ratio>0.65</max_server_memory_usage_to_ram_ratio>
    </clickhouse>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent-config
  namespace: molejo-observability-agents
data:
  collector.yaml: |
    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/molejo-observability_*/*/*.log]
        include_file_path: true
        start_at: end
        operators:
          - id: container-parser
            type: container
      kubeletstats:
        auth_type: serviceAccount
        collection_interval: 30s
        endpoint: https://${env:K8S_NODE_NAME}:10250
        metric_groups: [container, pod, node]
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 192
        spike_limit_mib: 48
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.container.name
          labels:
            - key: platform.fruto.calouro.tech/app-deployment
              tag_name: molejo.app_environment.runtime
              from: pod
      filter/runtime:
        error_mode: ignore
        logs:
          log_record:
            - 'resource.attributes["molejo.app_environment.runtime"] == nil'
        metrics:
          datapoint:
            - 'resource.attributes["molejo.app_environment.runtime"] == nil'
      batch:
        send_batch_size: 512
        timeout: 2s
    exporters:
      otlp:
        endpoint: otel-gateway.molejo-observability.svc:4317
        tls: { insecure: true }
        retry_on_failure: { enabled: true, max_elapsed_time: 5m }
        sending_queue: { enabled: true, queue_size: 2048 }
    service:
      telemetry:
        logs: { level: info }
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, filter/runtime, batch]
          exporters: [otlp]
        metrics:
          receivers: [kubeletstats]
          processors: [memory_limiter, k8sattributes, filter/runtime, batch]
          exporters: [otlp]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-cluster-config
  namespace: molejo-observability
data:
  collector.yaml: |
    receivers:
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: 30s
        metrics:
          k8s.container.restarts:
            enabled: true
          k8s.deployment.available:
            enabled: true
          k8s.deployment.desired:
            enabled: true
      k8s_events:
        auth_type: serviceAccount
      prometheus/platform:
        config:
          scrape_configs:
            - job_name: otel-collectors
              scrape_interval: 30s
              static_configs:
                - targets:
                    - 127.0.0.1:8888
                    - otel-gateway.molejo-observability.svc:8888
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 192
        spike_limit_mib: 48
      filter/runtime:
        error_mode: ignore
        logs:
          log_record:
            - 'attributes["k8s.namespace.name"] != "fruto-workspaces"'
        metrics:
          datapoint:
            - 'resource.attributes["k8s.namespace.name"] != "fruto-workspaces"'
      batch:
        send_batch_size: 512
        timeout: 2s
    exporters:
      otlp:
        endpoint: otel-gateway.molejo-observability.svc:4317
        tls: { insecure: true }
        retry_on_failure: { enabled: true, max_elapsed_time: 5m }
        sending_queue: { enabled: true, queue_size: 2048 }
    service:
      telemetry:
        logs: { level: info }
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_type_suffix: true
                    without_units: true
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          processors: [memory_limiter, filter/runtime, batch]
          exporters: [otlp]
        logs:
          receivers: [k8s_events]
          processors: [memory_limiter, filter/runtime, batch]
          exporters: [otlp]
        metrics/platform:
          receivers: [prometheus/platform]
          processors: [memory_limiter, batch]
          exporters: [otlp]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  namespace: molejo-observability
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 384
        spike_limit_mib: 96
      batch:
        send_batch_size: 1024
        timeout: 2s
    exporters:
      clickhouse:
        endpoint: tcp://clickhouse.molejo-observability.svc:9000?dial_timeout=10s
        database: otel
        username: molejo_ingest
        password: ${env:CLICKHOUSE_INGEST_PASSWORD}
        create_schema: true
        ttl: 168h
        logs_table_name: otel_logs
        retry_on_failure: { enabled: true, max_elapsed_time: 5m }
        sending_queue: { enabled: true, queue_size: 4096 }
      otlphttp/victoria:
        endpoint: http://victoria-metrics.molejo-observability.svc:8428/opentelemetry
        encoding: proto
        retry_on_failure: { enabled: true, max_elapsed_time: 5m }
        sending_queue: { enabled: true, queue_size: 4096 }
    service:
      telemetry:
        logs: { level: info }
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_type_suffix: true
                    without_units: true
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/victoria]
