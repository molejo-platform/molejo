                    - cpuMillis
                    - memoryMiB
                    type: object
                required:
                - limits
                - requests
                type: object
                x-kubernetes-validations:
                - message: CPU requests must not exceed CPU limits
                  rule: self.requests.cpuMillis <= self.limits.cpuMillis
                - message: memory requests must not exceed memory limits
                  rule: self.requests.memoryMiB <= self.limits.memoryMiB
              secretRef:
                description: SecretRef names an immutable Secret prepared by the control
                  plane.
                type: string
              variables:
                description: Variables are non-secret environment variables projected
                  into the workload.
                items:
                  description: AppDeploymentVariable declares one non-secret environment
                    variable.
                  properties:
                    name:
                      description: Name follows the portable environment variable
                        identifier format.
                      maxLength: 253
                      pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                      type: string
                    value:
                      description: Value is stored in clear text and must not contain
                        secret material.
                      maxLength: 4096
                      type: string
                  required:
                  - name
                  - value
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              withdrawn:
                default: false
                description: |-
                  Withdrawn is a terminal write barrier. Keep this object after removing its
                  children: deleting the barrier would let an uncertain old Create succeed.
                type: boolean
                x-kubernetes-validations:
                - message: withdrawal is terminal
                  rule: '!oldSelf || self'
              workload:
                description: Workload selects exactly one workload renderer.
                properties:
                  kind:
                    description: AppDeploymentWorkloadKind discriminates the workload
                      renderer.
                    enum:
                    - Stateless
                    - Stateful
                    type: string
                  stateful:
                    description: StatefulWorkload attaches one durable AppVolume to
                      the workload.
                    properties:
                      mountPath:
                        description: MountPath is the absolute path made writable
                          in the workload container.
                        maxLength: 255
                        minLength: 2
                        pattern: ^/[^[:cntrl:]]+$
                        type: string
                      volumeRef:
                        description: VolumeRef is the namespaced AppVolume identity.
                        maxLength: 63
                        pattern: ^vol-[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - mountPath
                    - volumeRef
                    type: object
                  stateless:
                    description: StatelessWorkload marks a workload without persistent
                      storage.
                    type: object
                required:
                - kind
                type: object
                x-kubernetes-validations:
                - message: Stateless requires only the stateless branch
                  rule: self.kind != 'Stateless' || (has(self.stateless) && !has(self.stateful))
                - message: Stateful requires only the stateful branch
                  rule: self.kind != 'Stateful' || (has(self.stateful) && !has(self.stateless))
            required:
            - image
            - probes
            - resources
            - withdrawn
            - workload
            type: object
            x-kubernetes-validations:
            - message: at least one legacy or named port is required
              rule: has(self.port) || has(self.ports)
            - message: Stateful workloads require exactly one replica
              rule: self.workload.kind != 'Stateful' || !has(self.replicas) || self.replicas
                == 1
          status:
            description: AppDeploymentStatus reports the observed workload state.
            properties:
              conditions:
                description: Conditions describe readiness, progress, and degradation.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
