---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: appdeployments.platform.fruto.calouro.tech
spec:
  group: platform.fruto.calouro.tech
  names:
    kind: AppDeployment
    listKind: AppDeploymentList
    plural: appdeployments
    shortNames:
    - appdep
    singular: appdeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AppDeployment represents an immutable application release projected
          onto Kubernetes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AppDeploymentSpec declares the minimum workload intent understood
              by the platform operator.
            properties:
              exposure:
                default: Private
                description: Exposure controls whether the workload is reachable through
                  the shared HTTPS Gateway.
                enum:
                - Private
                - Public
                type: string
              image:
                description: Image is an immutable OCI image reference.
                pattern: ^[a-z0-9][a-z0-9._:/-]*@sha256:[a-f0-9]{64}$
                type: string
              port:
                description: Port is the private HTTP port exposed by the workload.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              probes:
                description: Probes declares the HTTP health endpoints exposed by
                  the workload.
                properties:
                  liveness:
                    description: Liveness identifies the endpoint used to detect an
                      unhealthy process.
                    properties:
                      path:
                        description: Path is an absolute HTTP path served by the workload.
                        maxLength: 2048
                        minLength: 1
                        pattern: ^/.*$
                        type: string
                    required:
                    - path
                    type: object
                  readiness:
                    description: Readiness identifies the endpoint used to admit the
                      process to the Service.
                    properties:
                      path:
                        description: Path is an absolute HTTP path served by the workload.
                        maxLength: 2048
                        minLength: 1
                        pattern: ^/.*$
                        type: string
                    required:
                    - path
                    type: object
                required:
                - liveness
                - readiness
                type: object
              replicas:
                default: 1
                description: Replicas is the desired number of workload replicas.
                format: int32
                minimum: 1
                type: integer
              resources:
                description: Resources declares the required compute requests and
                  limits.
                properties:
                  limits:
                    description: Limits declares the maximum compute available to
                      the workload.
                    properties:
                      cpuMillis:
                        description: CPUMillis is CPU capacity measured in millicores.
                        format: int64
                        minimum: 1
                        type: integer
                      memoryMiB:
                        description: MemoryMiB is memory capacity measured in mebibytes.
                        format: int64
                        minimum: 1
                        type: integer
                    required:
                    - cpuMillis
                    - memoryMiB
                    type: object
                  requests:
                    description: Requests declares the minimum compute reserved for
                      the workload.
                    properties:
                      cpuMillis:
                        description: CPUMillis is CPU capacity measured in millicores.
                        format: int64
                        minimum: 1
                        type: integer
                      memoryMiB:
                        description: MemoryMiB is memory capacity measured in mebibytes.
                        format: int64
                        minimum: 1
                        type: integer
                    required:
                    - cpuMillis
                    - memoryMiB
                    type: object
                required:
                - limits
                - requests
                type: object
                x-kubernetes-validations:
                - message: CPU requests must not exceed CPU limits
                  rule: self.requests.cpuMillis <= self.limits.cpuMillis
                - message: memory requests must not exceed memory limits
                  rule: self.requests.memoryMiB <= self.limits.memoryMiB
              slug:
                description: Slug is the globally unique DNS label used for public
                  exposure.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$
                type: string
            required:
            - image
            - port
            - probes
            - resources
            type: object
            x-kubernetes-validations:
            - message: slug is required for public exposure
              rule: self.exposure != 'Public' || has(self.slug)
            - message: slug must be omitted for private exposure
              rule: self.exposure != 'Private' || !has(self.slug)
          status:
            description: AppDeploymentStatus reports the observed workload state.
            properties:
              conditions:
                description: Conditions describe readiness, progress, and degradation.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the latest generation successfully
                  projected to the workload.
                format: int64
                type: integer
              observedRelease:
                description: ObservedRelease is the immutable image reference projected
                  to the workload.
                type: string
              workloadRef:
                description: WorkloadRef identifies the Deployment managed for this
                  resource.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must start with ap- and contain at most 63 lowercase
            DNS-compatible characters
          rule: self.metadata.name.matches('^ap-[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$')
            && size(self.metadata.name) <= 63
    served: true
    storage: true
    subresources:
      status: {}
