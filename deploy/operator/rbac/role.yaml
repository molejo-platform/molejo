apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: molejo-platform-operator-runtime }
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete, get]
  - apiGroups: [""]
    resources: [services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, tcproutes]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [platform.molejo.dev]
    resources: [appdeployments, appvolumes]
    verbs: [get, list, watch]
  - apiGroups: [platform.molejo.dev]
    resources: [appdeployments/status, appvolumes/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: molejo-platform-operator-discovery }
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims, services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, tcproutes]
    verbs: [get, list, watch]
  - apiGroups: [platform.molejo.dev]
    resources: [appdeployments, appvolumes]
    verbs: [get, list, watch]
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: molejo-workspace-boundary }
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [platform.molejo.dev]
    resources: [workspaceplacements]
    verbs: [get, list, watch]
  - apiGroups: [platform.molejo.dev]
    resources: [workspaceplacements/status]
    verbs: [get, patch, update]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [molejo-cluster-agent-runtime, molejo-cluster-agent-observer, molejo-platform-operator-runtime]
    verbs: [bind]
