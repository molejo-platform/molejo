openapi: 3.1.0
info:
  title: Molejo Control Plane API
  version: 1.0.0
  description: Pre-alpha control-plane contract for the local beta workspace.
servers:
  - url: /
paths:
  /api/v1/session:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202':
          description: A second factor is required
          content: { application/json: { schema: { $ref: '#/components/schemas/MFAChallenge' } } }
    get:
      operationId: getSession
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: logout
      responses:
        '204': { description: Session revoked }
  /api/v1/auth/capabilities:
    get:
      operationId: getAuthenticationCapabilities
      responses:
        '200':
          description: Authentication methods enabled for this installation
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthenticationCapabilities' } } }
  /api/v1/session/mfa/totp:
    post:
      operationId: completeTOTPLogin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TOTPChallengeInput' } } }
      responses:
        '200': { description: Authenticated session at AAL2, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/users/me:
    get:
      operationId: getOwnProfile
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Current user profile, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: updateOwnProfile
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileInput' } } }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/users/me/password:
    put:
      operationId: changeOwnPassword
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChangeInput' } } }
      responses:
        '204': { description: Password changed and all sessions revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/me/sessions:
    get:
      operationId: listOwnSessions
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: '#/components/schemas/UserSession' } } }
  /api/v1/users/me/sessions/{userSessionId}:
    parameters: [{ $ref: '#/components/parameters/UserSessionId' }]
    delete:
      operationId: revokeOwnSession
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Session revoked }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/users/me/mfa:
    get:
      operationId: getOwnMFA
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Current MFA state, content: { application/json: { schema: { $ref: '#/components/schemas/MFAStatus' } } } }
  /api/v1/users/me/mfa/totp/enrollment:
    post:
      operationId: beginTOTPEnrollment
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordConfirmation' } } }
      responses:
        '201': { description: Enrollment secret shown once, content: { application/json: { schema: { $ref: '#/components/schemas/TOTPEnrollment' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: confirmTOTPEnrollment
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TOTPEnrollmentConfirmation' } } }
      responses:
        '200': { description: TOTP enabled and recovery codes shown once, content: { application/json: { schema: { $ref: '#/components/schemas/MFARecoveryCodes' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      operationId: disableOwnTOTP
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordConfirmation' } } }
      responses:
        '204': { description: TOTP disabled }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/password-resets/request:
    post:
      operationId: requestPasswordReset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } }
      responses:
        '202': { description: Request accepted regardless of user existence }
  /api/v1/password-resets/verify:
    post:
      operationId: verifyPasswordReset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetVerification' } } }
      responses:
        '200':
          description: Code verified
          content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetTicket' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/password-resets/complete:
    put:
      operationId: completePasswordReset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetCompletion' } } }
      responses:
        '204': { description: Password replaced and sessions revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/admin/users:
    get:
      operationId: listUsers
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Installation users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/User' } }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserCreateInput' } } }
      responses:
        '201': { description: User created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/users/{userId}:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    put:
      operationId: updateUserStatus
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserStatusInput' } } }
      responses:
        '200': { description: User updated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/users/{userId}/password-reset:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    post:
      operationId: createPasswordResetGrant
      security: [{ sessionCookie: [] }]
      responses:
        '201':
          description: One-time reset code; returned only on creation
          content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetGrant' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/clusters:
    get:
      operationId: listClusters
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Registered runtime clusters
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Cluster' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createCluster
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClusterCreateInput' } } }
      responses:
        '201':
          description: One-time cluster enrollment invitation
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentEnrollmentInvitation' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/clusters/{clusterId}:
    parameters: [{ $ref: '#/components/parameters/ClusterId' }]
    get:
      operationId: getCluster
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Runtime cluster, content: { application/json: { schema: { $ref: '#/components/schemas/Cluster' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: revokeCluster
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClusterRevocationInput' } } }
      responses:
        '204': { description: Cluster access revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/clusters/{clusterId}/enrollment-invitations:
    parameters: [{ $ref: '#/components/parameters/ClusterId' }]
    post:
      operationId: createClusterEnrollmentInvitation
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Replacement one-time enrollment invitation, content: { application/json: { schema: { $ref: '#/components/schemas/AgentEnrollmentInvitation' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/agent-installations:
    post:
      operationId: createAgentInstallation
      deprecated: true
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentInstallationCreateInput' } } }
      responses:
        '201':
          description: One-time Agent enrollment invitation
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentEnrollmentInvitation' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /agent/v1/enroll:
    post:
      operationId: enrollAgent
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentEnrollmentInput' } } }
      responses:
        '200':
          description: Signed Agent client identity
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentEnrollmentResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/members:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listWorkspaceMembers
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Workspace memberships
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/WorkspaceMembership' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createWorkspaceMember
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceMemberCreateInput' } } }
      responses:
        '201': { description: Membership created, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceMembership' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/UserId' }
    put:
      operationId: putWorkspaceMember
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OptionalIfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceMembershipInput' } } }
      responses:
        '200': { description: Membership saved, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceMembership' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWorkspaceMember
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Membership deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/workspaces/{workspaceId}/groups:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listWorkspaceGroups
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Workspace groups
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/WorkspaceGroup' } } } } } }
    post:
      operationId: createWorkspaceGroup
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceGroupInput' } } }
      responses:
        '201': { description: Group created, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceGroup' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/groups/{groupId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/GroupId' }
      - { $ref: '#/components/parameters/UserId' }
    put:
      operationId: addWorkspaceGroupMember
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Group member added }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: removeWorkspaceGroupMember
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Group member removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/workspaces/{workspaceId}/groups/{groupId}/members:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/GroupId' }
    get:
      operationId: listWorkspaceGroupMembers
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current members of the workspace group
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/WorkspaceMembership' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/workspaces/{workspaceId}/audit-events:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listAuditEvents
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Append-only workspace audit trail
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workspaces/{workspaceId}/access-grants:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listWorkspaceAccessGrants
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Explicit ReBAC relations in this Workspace
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AccessGrant' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createWorkspaceAccessGrant
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AccessGrantInput' } } }
      responses:
        '201': { description: Relation granted, content: { application/json: { schema: { $ref: '#/components/schemas/AccessGrant' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/access-grants/{accessGrantId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/AccessGrantId' }
    delete:
      operationId: deleteWorkspaceAccessGrant
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Relation revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/workspaces/current:
    get:
      operationId: getCurrentWorkspace
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Authorized workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Authorized workspaces
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Workspace' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createWorkspace
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OptionalIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceCreateInput' }
      responses:
        '202':
          description: Workspace creation accepted
          content:
            application/json:
              schema:
                type: object
                required: [workspace, operation]
                properties:
                  workspace: { $ref: '#/components/schemas/Workspace' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: getWorkspace
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Authorized workspace
          content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateWorkspace
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyInput' } } }
      responses:
        '200':
          description: Updated workspace
          content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/clusters:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listWorkspaceClusters
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Workspace runtime placements, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/WorkspaceCluster' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: attachWorkspaceCluster
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceClusterInput' } } }
      responses:
        '202':
          description: Workspace placement accepted
          content:
            application/json:
              schema:
                type: object
                required: [workspaceCluster, operation]
                properties:
                  workspaceCluster: { $ref: '#/components/schemas/WorkspaceCluster' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/parameters:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listParameters
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Workspace parameters
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Parameter' } }
                  nextCursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createParameter
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ParameterInput' } } }
      responses:
        '201':
          description: Created parameter
          content: { application/json: { schema: { $ref: '#/components/schemas/Parameter' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/workspaces/{workspaceId}/parameters/{parameterId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ParameterId' }
    get:
      operationId: getParameter
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Parameter metadata and current PlainText value
          content: { application/json: { schema: { $ref: '#/components/schemas/Parameter' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
