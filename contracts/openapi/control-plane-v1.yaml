    RuntimeLogBatch:
      type: object
      required: [cursor, items]
      additionalProperties: false
      properties:
        cursor: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/RuntimeLog' } }
    RuntimeMetricPoint:
