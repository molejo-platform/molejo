        clusterId: { type: string, pattern: '^(cls|agi)-[a-z2-7]{20}$' }
        projectId: { type: string, pattern: '^prj-[a-z2-7]{20}$' }
        appId: { type: string, pattern: '^app-[a-z2-7]{20}$' }
        appName: { type: string, minLength: 1, maxLength: 80 }
