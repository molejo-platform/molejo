openapi: 3.1.0
info:
  title: Molejo Control Plane API
  version: 0.1.0-alpha
  description: The version describes the alpha contract maturity; `/api/v1` is the route generation, not a production-stability promise. Session-authenticated mutations require the CSRF security scheme and an allowed Origin.
servers:
  - url: /
paths:
  /api/v1/session:
    post:
      operationId: login
      security: []
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202':
          description: A second factor is required
          content: { application/json: { schema: { $ref: '#/components/schemas/MFAChallenge' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      operationId: getSession
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: logout
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/capabilities:
    get:
      operationId: getAuthenticationCapabilities
      security: []
      responses:
        '200':
          description: Authentication methods enabled for this installation
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthenticationCapabilities' } } }
  /api/v1/session/mfa/totp:
    post:
      operationId: completeTOTPLogin
      security: []
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TOTPChallengeInput' } } }
      responses:
        '200': { description: Authenticated session at AAL2, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/users/me:
    get:
      operationId: getOwnProfile
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Current user profile, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: updateOwnProfile
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileInput' } } }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/users/me/password:
    put:
      operationId: changeOwnPassword
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChangeInput' } } }
      responses:
        '204': { description: Password changed and all sessions revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/me/sessions:
    get:
      operationId: listOwnSessions
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: '#/components/schemas/UserSession' } } }
  /api/v1/users/me/sessions/{userSessionId}:
    parameters: [{ $ref: '#/components/parameters/UserSessionId' }]
    delete:
      operationId: revokeOwnSession
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '204': { description: Session revoked }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/users/me/mfa:
    get:
      operationId: getOwnMFA
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Current MFA state, content: { application/json: { schema: { $ref: '#/components/schemas/MFAStatus' } } } }
  /api/v1/users/me/mfa/totp/enrollment:
    post:
      operationId: beginTOTPEnrollment
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordConfirmation' } } }
      responses:
        '201': { description: Enrollment secret shown once, content: { application/json: { schema: { $ref: '#/components/schemas/TOTPEnrollment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: confirmTOTPEnrollment
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TOTPEnrollmentConfirmation' } } }
      responses:
        '200': { description: TOTP enabled and recovery codes shown once, content: { application/json: { schema: { $ref: '#/components/schemas/MFARecoveryCodes' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: disableOwnTOTP
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordConfirmation' } } }
      responses:
        '204': { description: TOTP disabled }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/password-resets/request:
    post:
      operationId: requestPasswordReset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } }
      responses:
        '202': { description: Request accepted regardless of user existence }
  /api/v1/password-resets/verify:
    post:
      operationId: verifyPasswordReset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetVerification' } } }
      responses:
        '200':
          description: Code verified
          content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetTicket' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/password-resets/complete:
    put:
      operationId: completePasswordReset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetCompletion' } } }
      responses:
        '204': { description: Password replaced and sessions revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/user-invitations/accept:
    put:
      operationId: acceptUserInvitation
      security: []
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserInvitationAcceptance' } } }
      responses:
        '204': { description: Invitation accepted and local password created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/users:
    get:
      operationId: listUsers
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Installation users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InstallationUser' } }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserCreateInput' } } }
      responses:
        '201': { description: Invited user and one-time activation credential, content: { application/json: { schema: { $ref: '#/components/schemas/UserInvitation' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/users/{userId}:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    put:
      operationId: updateUserStatus
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserStatusInput' } } }
      responses:
        '200': { description: User updated, content: { application/json: { schema: { $ref: '#/components/schemas/InstallationUser' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/users/{userId}/password-reset:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    post:
      operationId: createPasswordResetGrant
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '201':
          description: One-time reset code; returned only on creation
          content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetGrant' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/users/{userId}/installation-role:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    put:
      operationId: updateUserInstallationRole
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InstallationRoleInput' } } }
      responses:
        '200': { description: Installation role updated, content: { application/json: { schema: { $ref: '#/components/schemas/InstallationUser' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/users/{userId}/invitation:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    post:
      operationId: createUserInvitation
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '201': { description: Replacement one-time activation credential, content: { application/json: { schema: { $ref: '#/components/schemas/UserInvitationCredential' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/audit-events:
    get:
      operationId: listInstallationAuditEvents
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Append-only installation audit trail
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/clusters:
    get:
      operationId: listClusters
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Registered runtime clusters
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Cluster' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createCluster
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClusterCreateInput' } } }
      responses:
        '201':
          description: One-time cluster enrollment invitation
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentEnrollmentInvitation' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/clusters/{clusterId}:
    parameters: [{ $ref: '#/components/parameters/ClusterId' }]
    get:
      operationId: getCluster
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Runtime cluster, content: { application/json: { schema: { $ref: '#/components/schemas/Cluster' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: revokeCluster
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClusterRevocationInput' } } }
      responses:
        '204': { description: Cluster access revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/clusters/{clusterId}/enrollment-invitations:
    parameters: [{ $ref: '#/components/parameters/ClusterId' }]
    post:
      operationId: createClusterEnrollmentInvitation
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '201': { description: Replacement one-time enrollment invitation, content: { application/json: { schema: { $ref: '#/components/schemas/AgentEnrollmentInvitation' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/clusters/{clusterId}/bindings/historical-metrics:
    parameters: [{ $ref: '#/components/parameters/ClusterId' }]
    get:
      operationId: getHistoricalMetricBinding
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Historical metric provider binding, content: { application/json: { schema: { $ref: '#/components/schemas/HistoricalMetricBinding' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putHistoricalMetricBinding
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/OptionalIfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HistoricalMetricBindingInput' } } }
      responses:
        '200': { description: Historical metric provider binding updated and reverified, content: { application/json: { schema: { $ref: '#/components/schemas/HistoricalMetricBinding' } } } }
        '201': { description: Historical metric provider binding created and verified, content: { application/json: { schema: { $ref: '#/components/schemas/HistoricalMetricBinding' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteHistoricalMetricBinding
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Historical metric provider binding removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/clusters/{clusterId}/bindings/storage:
    parameters: [{ $ref: '#/components/parameters/ClusterId' }]
    get:
      operationId: listClusterStorageBindings
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Storage profile bindings selected for the cluster
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ClusterStorageBinding' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/clusters/{clusterId}/bindings/storage/{storageProfileId}:
    parameters:
      - { $ref: '#/components/parameters/ClusterId' }
      - { name: storageProfileId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$' } }
    get:
      operationId: getClusterStorageBinding
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Storage profile binding, content: { application/json: { schema: { $ref: '#/components/schemas/ClusterStorageBinding' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putClusterStorageBinding
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/OptionalIfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClusterStorageBindingInput' } } }
      responses:
        '200': { description: Storage profile binding updated, content: { application/json: { schema: { $ref: '#/components/schemas/ClusterStorageBinding' } } } }
        '201': { description: Storage profile binding created, content: { application/json: { schema: { $ref: '#/components/schemas/ClusterStorageBinding' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteClusterStorageBinding
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Storage profile binding removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/clusters/{clusterId}/bindings/publication/http:
    parameters: [{ $ref: '#/components/parameters/ClusterId' }]
    get:
      operationId: getClusterPublicationBinding
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: HTTP publication binding, content: { application/json: { schema: { $ref: '#/components/schemas/ClusterPublicationBinding' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putClusterPublicationBinding
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/OptionalIfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClusterPublicationBindingInput' } } }
      responses:
        '200': { description: HTTP publication binding updated, content: { application/json: { schema: { $ref: '#/components/schemas/ClusterPublicationBinding' } } } }
        '201': { description: HTTP publication binding created, content: { application/json: { schema: { $ref: '#/components/schemas/ClusterPublicationBinding' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteClusterPublicationBinding
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: HTTP publication binding removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/agent-installations:
    post:
      operationId: createAgentInstallation
      deprecated: true
      description: Deprecated compatibility endpoint. Use `POST /api/v1/admin/clusters`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentInstallationCreateInput' } } }
      responses:
        '201':
          description: One-time Agent enrollment invitation
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentEnrollmentInvitation' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /agent/v1/enroll:
    post:
      operationId: enrollAgent
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentEnrollmentInput' } } }
      responses:
        '200':
          description: Signed Agent client identity
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentEnrollmentResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/members:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listWorkspaceMembers
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Workspace memberships
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/WorkspaceMembership' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createWorkspaceMember
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceMemberCreateInput' } } }
      responses:
        '201': { description: Membership created, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceMembership' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/UserId' }
    put:
      operationId: putWorkspaceMember
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/OptionalIfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceMembershipInput' } } }
      responses:
