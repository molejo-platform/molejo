    DeploymentTarget:
      type: object
      required: [releaseId, configurationVersion]
      additionalProperties: false
      properties:
        releaseId: { type: string, pattern: '^rel-[a-z2-7]{20}$' }
        configurationVersion: { type: integer, minimum: 1 }
