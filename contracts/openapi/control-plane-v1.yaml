components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: molejo_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with session-cookie authentication for state-changing requests; browsers must also send an allowed Origin.
    automationBearer:
      type: http
      scheme: bearer
      bearerFormat: Molejo service account token
      description: When Authorization is present on a dual-authentication operation, bearer authentication is authoritative and the server never falls back to a session cookie.
  parameters:
    PublicationCursor:
      name: cursor
      in: query
      description: Opaque keyset cursor returned by the preceding publication page.
      schema: { type: string, minLength: 1, maxLength: 512 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IncludeArchived:
      name: includeArchived
      in: query
      schema: { type: boolean, default: false }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, pattern: '^ws-[a-z2-7]{20}$' }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, pattern: '^prj-[a-z2-7]{20}$' }
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema: { type: string, pattern: '^env-[a-z2-7]{20}$' }
    AppId:
      name: appId
      in: path
      required: true
      schema: { type: string, pattern: '^app-[a-z2-7]{20}$' }
    AppEnvironmentId:
      name: appEnvironmentId
      in: path
      required: true
      schema: { type: string, pattern: '^aev-[a-z2-7]{20}$' }
    ParameterId:
      name: parameterId
      in: path
      required: true
      schema: { type: string, pattern: '^par-[a-z2-7]{20}$' }
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema: { type: string, pattern: '^dpl-[a-z2-7]{20}$' }
    GitHubInstallationId:
      name: githubInstallationId
      in: path
      required: true
      schema: { type: string, pattern: '^ghi-[a-z2-7]{20}$' }
    BuildId:
      name: buildId
      in: path
      required: true
      schema: { type: string, pattern: '^bld-[a-z2-7]{20}$' }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { type: string, pattern: '^rel-[a-z2-7]{20}$' }
    ServiceAccountId:
      name: serviceAccountId
      in: path
      required: true
      schema: { type: string, pattern: '^svc-[a-z2-7]{20}$' }
    ServiceAccountTokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, pattern: '^sat-[a-z2-7]{20}$' }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, pattern: '^usr-[a-z2-7]{20}$' }
    UserSessionId:
      name: userSessionId
      in: path
      required: true
      schema: { type: string, pattern: '^ses-[a-z2-7]{20}$' }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, pattern: '^grp-[a-z2-7]{20}$' }
    AccessGrantId:
      name: accessGrantId
      in: path
      required: true
      schema: { type: string, pattern: '^agr-[a-z2-7]{20}$' }
    ClusterId:
      name: clusterId
      in: path
      required: true
      schema: { type: string, pattern: '^(cls|agi)-[a-z2-7]{20}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required for Secret parameter mutations; ignored for PlainText mutations.
      schema: { type: string, minLength: 1, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: integer, minimum: 1 }
    OptionalIfMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: integer, minimum: 1 }
    DeliveryPolicyIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: integer, minimum: 0 }
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    Unauthorized:
      description: Authentication required
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated user cannot perform this action
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Version or idempotency conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unavailable:
      description: External integration is not configured or unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: Concurrent request limit reached
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InternalError:
      description: Request failed unexpectedly
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    MutationAccepted:
      description: Mutation accepted for asynchronous execution
      content:
        application/json:
          schema:
            type: object
            required: [operation]
            properties:
              deployment: { $ref: '#/components/schemas/Deployment' }
              operation: { $ref: '#/components/schemas/Operation' }
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
    Session:
      type: object
      required: [user, assuranceLevel, csrfToken, installationCapabilities, workspaceMemberships]
      additionalProperties: false
      properties:
        user: { $ref: '#/components/schemas/User' }
        assuranceLevel: { type: string, enum: [AAL1, AAL2] }
        csrfToken: { type: string, readOnly: true }
        installationCapabilities:
          type: object
          required: [manageUsers, manageBindings, createWorkspace, publicTCP]
          additionalProperties: false
          properties:
            manageUsers: { type: boolean }
            manageBindings: { type: boolean }
            createWorkspace: { type: boolean }
            publicTCP:
              type: object
              required: [enabled]
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                address: { type: string, maxLength: 253 }
                minimumPort: { type: integer, minimum: 1, maximum: 65535 }
                maximumPort: { type: integer, minimum: 1, maximum: 65535 }
            publicationDomains:
              type: array
              items:
                type: object
                required: [id, suffix, workloadKinds, endpointTypes]
                additionalProperties: false
                properties:
                  id: { type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$' }
                  suffix: { type: string, minLength: 1, maxLength: 253 }
                  workloadKinds:
                    type: array
                    items: { type: string, enum: [Stateless, Stateful] }
                  endpointTypes:
                    type: array
                    items: { type: string, enum: [HTTP, TCP] }
        workspaceMemberships:
          type: array
          items:
            type: object
            required: [workspaceId, role]
            additionalProperties: false
            properties:
              workspaceId: { type: string, pattern: '^ws-[a-z2-7]{20}$' }
              role: { type: string, enum: [Owner, Member, Viewer] }
    AuthenticationCapabilities:
      type: object
      required: [password, totp, passkey]
      additionalProperties: false
      properties:
        password: { type: boolean }
        totp: { type: boolean }
        passkey: { type: boolean }
    MFAChallenge:
      type: object
      required: [mfaRequired, method, challengeToken]
      additionalProperties: false
      properties:
        mfaRequired: { type: boolean, const: true }
        method: { type: string, enum: [TOTP] }
        challengeToken: { type: string, readOnly: true }
    TOTPChallengeInput:
      type: object
      required: [challengeToken, code]
      additionalProperties: false
      properties:
        challengeToken: { type: string, writeOnly: true }
