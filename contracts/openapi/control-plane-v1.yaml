        configuration: { $ref: '#/components/schemas/RuntimeConfiguration' }
    AppEnvironmentCreateInput:
      type: object
      required: [environmentId, clusterId, branch, workloadKind, configuration]
      additionalProperties: false
      properties:
        environmentId: { type: string, pattern: '^env-[a-z2-7]{20}$' }
        clusterId: { type: string, pattern: '^(cls|agi)-[a-z2-7]{20}$' }
        branch: { type: string, minLength: 1, maxLength: 255 }
        workloadKind: { type: string, enum: [Stateless, Stateful] }
        volume: { $ref: '#/components/schemas/AppVolumeRequest' }
        configuration: { $ref: '#/components/schemas/RuntimeConfiguration' }
    AppEnvironment:
      type: object
      required: [id, clusterId, projectId, appId, appName, environmentId, environmentName, branch, workloadKind, configuration, configurationVersion, version, state, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^aev-[a-z2-7]{20}$' }
        clusterId: { type: string, pattern: '^(cls|agi)-[a-z2-7]{20}$' }
        projectId: { type: string, pattern: '^prj-[a-z2-7]{20}$' }
        appId: { type: string, pattern: '^app-[a-z2-7]{20}$' }
        appName: { type: string, minLength: 1, maxLength: 80 }
        environmentId: { type: string, pattern: '^env-[a-z2-7]{20}$' }
        environmentName: { type: string, minLength: 1, maxLength: 80 }
        branch: { type: string, minLength: 1, maxLength: 255 }
        workloadKind: { type: string, enum: [Stateless, Stateful] }
        configuration: { $ref: '#/components/schemas/RuntimeConfiguration' }
        configurationVersion: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
        desiredDeploymentId: { type: string, pattern: '^dpl-[a-z2-7]{20}$' }
        currentDeploymentId: { type: string, pattern: '^dpl-[a-z2-7]{20}$' }
        currentReleaseId: { type: string, pattern: '^rel-[a-z2-7]{20}$' }
        desiredConfigurationVersion: { type: integer, minimum: 1 }
        currentConfigurationVersion: { type: integer, minimum: 1 }
        runtimeObservedGeneration: { type: integer, minimum: 0 }
        runtimeObservedAt: { type: string, format: date-time }
        state: { type: string, enum: [Pending, Progressing, Ready, Degraded, Unknown] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AppVolumeRequest:
      type: object
      required: [storageProfileId, sizeGiB, mountPath]
      additionalProperties: false
      properties:
        storageProfileId: { type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$' }
        sizeGiB: { type: integer, minimum: 1 }
        mountPath: { type: string, minLength: 2, maxLength: 255, pattern: '^/[^[:cntrl:]]+$' }
    AppVolumeExpansionInput:
      type: object
      required: [sizeGiB]
      additionalProperties: false
      properties:
        sizeGiB: { type: integer, minimum: 1 }
    StorageProfile:
      type: object
      required: [id, name, minimumSizeGiB, maximumSizeGiB, availableGiB, expandable, snapshots, automaticBackup, durability]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 63 }
        name: { type: string, minLength: 1, maxLength: 80 }
        minimumSizeGiB: { type: integer, minimum: 1 }
        maximumSizeGiB: { type: integer, minimum: 1 }
        availableGiB: { type: integer, minimum: 0 }
        expandable: { type: boolean }
        snapshots: { type: boolean }
        automaticBackup: { type: boolean }
        durability: { type: string, enum: [NodeLocal, Replicated, ProviderManaged] }
    AppVolume:
      type: object
      required: [id, appEnvironmentId, storageProfileId, sizeGiB, mountPath, retentionPolicy, desiredState, state, attached, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^vol-[a-z2-7]{20}$' }
        appEnvironmentId: { type: string, pattern: '^aev-[a-z2-7]{20}$' }
        storageProfileId: { type: string, minLength: 1, maxLength: 63 }
        sizeGiB: { type: integer, minimum: 1 }
        mountPath: { type: string, minLength: 2, maxLength: 255 }
        retentionPolicy: { type: string, enum: [Preserve] }
        desiredState: { type: string, enum: [Ready, Deleted] }
        state: { type: string, enum: [Pending, Provisioning, Ready, Expanding, Retained, Degraded] }
        message: { type: string }
        attached: { type: boolean }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AppVolumeMutation:
      type: object
      required: [volume, operation]
      additionalProperties: false
      properties:
        volume: { $ref: '#/components/schemas/AppVolume' }
        operation: { $ref: '#/components/schemas/Operation' }
    DeploymentInput:
      type: object
      required: [releaseId, configurationVersion, currentDeploymentId]
      additionalProperties: false
      properties:
        releaseId: { type: string, pattern: '^rel-[a-z2-7]{20}$' }
        configurationVersion: { type: integer, minimum: 1 }
        currentDeploymentId:
          type: [string, 'null']
          pattern: '^dpl-[a-z2-7]{20}$'
    DeploymentPreviewInput:
      type: object
      required: [releaseId, configurationVersion]
      additionalProperties: false
      properties:
        releaseId: { type: string, pattern: '^rel-[a-z2-7]{20}$' }
        configurationVersion: { type: integer, minimum: 1 }
    DeploymentTarget:
      type: object
      required: [releaseId, configurationVersion]
      additionalProperties: false
      properties:
        releaseId: { type: string, pattern: '^rel-[a-z2-7]{20}$' }
        configurationVersion: { type: integer, minimum: 1 }
    DeploymentPreview:
      type: object
      required: [target, changes, rolloutRequired]
      additionalProperties: false
      properties:
        current: { $ref: '#/components/schemas/DeploymentTarget' }
        target: { $ref: '#/components/schemas/DeploymentTarget' }
        changes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [InitialDeployment, Release, Scale, Network, HealthChecks, Resources, Variables, Secrets]
        rolloutRequired: { type: boolean }
    ConfigurationRevision:
      type: object
      required: [appEnvironmentId, version, configuration, createdBy, createdAt]
      additionalProperties: false
      properties:
        appEnvironmentId: { type: string, pattern: '^aev-[a-z2-7]{20}$' }
        version: { type: integer, minimum: 1 }
        configuration: { $ref: '#/components/schemas/RuntimeConfiguration' }
        createdBy: { type: string, minLength: 1 }
        createdAt: { type: string, format: date-time }
    ResourceValues:
      type: object
      required: [cpuMillis, memoryMiB]
      additionalProperties: false
      properties:
        cpuMillis: { type: integer, minimum: 1, maximum: 2000 }
        memoryMiB: { type: integer, minimum: 1, maximum: 2048 }
    Probe:
      type: object
      required: [type, portName]
      additionalProperties: false
      properties:
        type: { type: string, enum: [HTTP, TCP] }
        portName: { type: string, minLength: 1, maxLength: 15, pattern: '^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$' }
        path: { type: string, maxLength: 2048, pattern: '^/' }
    RuntimePort:
      type: object
      required: [name, containerPort, protocol]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 15, pattern: '^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$' }
        containerPort: { type: integer, minimum: 1, maximum: 65535 }
        protocol: { type: string, enum: [TCP] }
    PublicEndpoint:
      type: object
      required: [name, type, portName, domainId, hostnameLabel]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 15, pattern: '^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$' }
        type: { type: string, enum: [HTTP, TCP] }
        portName: { type: string, minLength: 1, maxLength: 15, pattern: '^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$' }
        domainId: { type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$' }
        hostnameLabel: { type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$' }
        externalPort: { type: integer, minimum: 1, maximum: 65535, readOnly: true }
    Deployment:
      type: object
      required: [id, appEnvironmentId, releaseId, workloadKind, configurationVersion, configuration, requestedBy, state, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^dpl-[a-z2-7]{20}$' }
        appEnvironmentId: { type: string, pattern: '^aev-[a-z2-7]{20}$' }
        releaseId: { type: string, pattern: '^rel-[a-z2-7]{20}$' }
        workloadKind: { type: string, enum: [Stateless, Stateful] }
        appVolumeId: { type: string, pattern: '^vol-[a-z2-7]{20}$' }
        configurationVersion: { type: integer, minimum: 1 }
        configuration: { $ref: '#/components/schemas/RuntimeConfiguration' }
        requestedBy: { type: string, minLength: 1 }
        state: { type: string, enum: [Pending, Progressing, Ready, Degraded] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Operation:
      type: object
      required: [id, kind, status, desiredVersion, attempts]
      properties:
        id: { type: string, pattern: '^op-' }
        appEnvironmentId: { type: string, pattern: '^aev-[a-z2-7]{20}$' }
        deploymentId: { type: string, pattern: '^dpl-[a-z2-7]{20}$' }
        appVolumeId: { type: string, pattern: '^vol-[a-z2-7]{20}$' }
        kind: { type: string, enum: [ApplyDeployment, DeleteAppEnvironment, EnsureWorkspace, EnsureVolume, ExpandVolume, DeleteVolume] }
        status: { type: string, enum: [Pending, Running, Succeeded, Failed] }
        desiredVersion: { type: integer, minimum: 1 }
        attempts: { type: integer, minimum: 0 }
        errorCode: { type: string }
        errorMessage: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RuntimeLog:
      type: object
      required: [id, timestamp, body, severity]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^log-[a-f0-9]{32}$' }
        timestamp: { type: string, format: date-time }
        body: { type: string, maxLength: 65536 }
        severity: { type: string, maxLength: 253 }
    RuntimeLogs:
      type: object
      required: [from, to, liveCursor, items]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        liveCursor: { type: string }
        nextCursor: { type: [string, 'null'] }
        items: { type: array, items: { $ref: '#/components/schemas/RuntimeLog' } }
    RuntimeLogBatch:
      type: object
      required: [cursor, items]
      additionalProperties: false
      properties:
        cursor: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/RuntimeLog' } }
    RuntimeMetricPoint:
      type: object
      required: [timestamp, value]
      additionalProperties: false
      properties:
        timestamp: { type: string, format: date-time }
        value: { type: number }
    RuntimeMetricSeries:
      type: object
      required: [name, unit, points]
      additionalProperties: false
      properties:
        name: { type: string, enum: [cpu, memory, restarts, available, desired] }
        unit: { type: string, enum: [cores, bytes, count, replicas] }
        points: { type: array, items: { $ref: '#/components/schemas/RuntimeMetricPoint' } }
    RuntimeMetrics:
      type: object
      required: [from, to, step, resolutionSeconds, partial, unavailable, series]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step: { type: string }
        resolutionSeconds: { type: integer, minimum: 15, maximum: 3600 }
        partial: { type: boolean }
        unavailable: { type: array, items: { type: string, enum: [cpu, memory, restarts, available, desired] } }
        series: { type: array, items: { $ref: '#/components/schemas/RuntimeMetricSeries' } }
    RuntimeMetricSample:
      type: object
      required: [name, unit, timestamp, value]
      additionalProperties: false
      properties:
        name: { type: string, enum: [cpu, memory, restarts, available, desired] }
        unit: { type: string, enum: [cores, bytes, count, replicas] }
        timestamp: { type: string, format: date-time }
        value: { type: number }
    RuntimeMetricSnapshot:
      type: object
      required: [observedAt, partial, unavailable, samples]
      additionalProperties: false
      properties:
        observedAt: { type: string, format: date-time }
        partial: { type: boolean }
        unavailable: { type: array, items: { type: string, enum: [cpu, memory, restarts, available, desired] } }
        samples: { type: array, items: { $ref: '#/components/schemas/RuntimeMetricSample' } }
    RuntimeEvent:
      type: object
      required: [timestamp, source, type, reason, message]
      additionalProperties: false
      properties:
        timestamp: { type: string, format: date-time }
        source: { type: string, enum: [control-plane, kubernetes] }
        type: { type: string, maxLength: 253 }
        reason: { type: string, maxLength: 253 }
        message: { type: string, maxLength: 65536 }
    RuntimeEvents:
      type: object
      required: [from, to, items]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/RuntimeEvent' } }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
