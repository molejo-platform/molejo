  /api/v1/operations/{operationId}:
    get:
      operationId: getOperation
      security: [{ sessionCookie: [] }, { automationBearer: [] }]
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string, pattern: '^op-[a-z2-7]{20}$' }
      responses:
        '200':
          description: Operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: molejo_session
    automationBearer:
      type: http
      scheme: bearer
      bearerFormat: Molejo service account token
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IncludeArchived:
      name: includeArchived
      in: query
      schema: { type: boolean, default: false }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, pattern: '^ws-[a-z2-7]{20}$' }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, pattern: '^prj-[a-z2-7]{20}$' }
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema: { type: string, pattern: '^env-[a-z2-7]{20}$' }
    AppId:
      name: appId
      in: path
      required: true
      schema: { type: string, pattern: '^app-[a-z2-7]{20}$' }
    AppEnvironmentId:
      name: appEnvironmentId
      in: path
      required: true
      schema: { type: string, pattern: '^aev-[a-z2-7]{20}$' }
    ParameterId:
      name: parameterId
      in: path
      required: true
      schema: { type: string, pattern: '^par-[a-z2-7]{20}$' }
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema: { type: string, pattern: '^dpl-[a-z2-7]{20}$' }
    GitHubInstallationId:
      name: githubInstallationId
      in: path
      required: true
      schema: { type: string, pattern: '^ghi-[a-z2-7]{20}$' }
    BuildId:
      name: buildId
      in: path
      required: true
      schema: { type: string, pattern: '^bld-[a-z2-7]{20}$' }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { type: string, pattern: '^rel-[a-z2-7]{20}$' }
    ServiceAccountId:
      name: serviceAccountId
      in: path
      required: true
      schema: { type: string, pattern: '^svc-[a-z2-7]{20}$' }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, pattern: '^usr-[a-z2-7]{20}$' }
    UserSessionId:
      name: userSessionId
      in: path
      required: true
      schema: { type: string, pattern: '^ses-[a-z2-7]{20}$' }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, pattern: '^grp-[a-z2-7]{20}$' }
    AccessGrantId:
      name: accessGrantId
      in: path
      required: true
      schema: { type: string, pattern: '^agr-[a-z2-7]{20}$' }
    ClusterId:
      name: clusterId
      in: path
      required: true
      schema: { type: string, pattern: '^(cls|agi)-[a-z2-7]{20}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required for Secret parameter mutations; ignored for PlainText mutations.
      schema: { type: string, minLength: 1, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: integer, minimum: 1 }
    OptionalIfMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: integer, minimum: 1 }
    DeliveryPolicyIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: integer, minimum: 0 }
  responses:
    Unauthorized:
      description: Authentication required
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated user cannot perform this action
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Version or idempotency conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unavailable:
      description: External integration is not configured or unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: Concurrent request limit reached
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    MutationAccepted:
      description: Mutation accepted for asynchronous execution
      content:
        application/json:
          schema:
            type: object
            required: [operation]
            properties:
              deployment: { $ref: '#/components/schemas/Deployment' }
              operation: { $ref: '#/components/schemas/Operation' }
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
    Session:
      type: object
      required: [user, assuranceLevel, csrfToken, installationCapabilities, workspaceMemberships]
      additionalProperties: false
      properties:
        user: { $ref: '#/components/schemas/User' }
        assuranceLevel: { type: string, enum: [AAL1, AAL2] }
        csrfToken: { type: string, writeOnly: true }
        installationCapabilities:
          type: object
          required: [manageUsers, createWorkspace, publicTCP]
          additionalProperties: false
          properties:
            manageUsers: { type: boolean }
            createWorkspace: { type: boolean }
            publicTCP:
              type: object
              required: [enabled]
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                address: { type: string, maxLength: 253 }
                minimumPort: { type: integer, minimum: 1, maximum: 65535 }
                maximumPort: { type: integer, minimum: 1, maximum: 65535 }
            publicationDomains:
              type: array
              items:
                type: object
                required: [id, suffix, workloadKinds, endpointTypes]
                additionalProperties: false
                properties:
                  id: { type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$' }
                  suffix: { type: string, minLength: 1, maxLength: 253 }
                  workloadKinds:
                    type: array
                    items: { type: string, enum: [Stateless, Stateful] }
                  endpointTypes:
                    type: array
                    items: { type: string, enum: [HTTP, TCP] }
        workspaceMemberships:
          type: array
          items:
            type: object
            required: [workspaceId, role]
            additionalProperties: false
            properties:
              workspaceId: { type: string, pattern: '^ws-[a-z2-7]{20}$' }
              role: { type: string, enum: [Owner, Member, Viewer] }
    AuthenticationCapabilities:
      type: object
      required: [password, totp, passkey]
      additionalProperties: false
      properties:
        password: { type: boolean }
        totp: { type: boolean }
        passkey: { type: boolean }
    MFAChallenge:
      type: object
      required: [mfaRequired, method, challengeToken]
      additionalProperties: false
      properties:
        mfaRequired: { type: boolean, const: true }
        method: { type: string, enum: [TOTP] }
        challengeToken: { type: string, writeOnly: true }
    TOTPChallengeInput:
      type: object
      required: [challengeToken, code]
      additionalProperties: false
      properties:
        challengeToken: { type: string, writeOnly: true }
        code: { type: string, pattern: '^([0-9]{6}|[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4})$', writeOnly: true }
    MFAStatus:
      type: object
      required: [totpEnabled, passkeyCount]
      additionalProperties: false
      properties:
        totpEnabled: { type: boolean }
        passkeyCount: { type: integer, minimum: 0 }
    TOTPEnrollment:
      type: object
      required: [challengeToken, secret, otpAuthUrl]
      additionalProperties: false
      properties:
        challengeToken: { type: string, writeOnly: true }
        secret: { type: string, writeOnly: true }
        otpAuthUrl: { type: string, writeOnly: true }
    TOTPEnrollmentConfirmation:
      type: object
      required: [challengeToken, code]
      additionalProperties: false
      properties:
        challengeToken: { type: string, writeOnly: true }
        code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
    MFARecoveryCodes:
      type: object
      required: [recoveryCodes]
      additionalProperties: false
      properties:
