openapi: 3.1.0
info:
  title: Molejo Control Plane API
  version: 1.0.0
  description: Pre-alpha control-plane contract for the local beta workspace.
servers:
  - url: /
paths:
  /api/v1/session:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: getSession
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: logout
      responses:
        '204': { description: Session revoked }
  /api/v1/workspaces/current:
    get:
      operationId: getCurrentWorkspace
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Authorized workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Authorized workspaces
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Workspace' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createWorkspace
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HierarchyInput' }
      responses:
        '202':
          description: Workspace creation accepted
          content:
            application/json:
              schema:
                type: object
                required: [workspace, operation]
                properties:
                  workspace: { $ref: '#/components/schemas/Workspace' }
                  operation: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: getWorkspace
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Authorized workspace
          content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateWorkspace
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyInput' } } }
      responses:
        '200':
          description: Updated workspace
          content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/projects:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listProjects
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/IncludeArchived' }
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Project' } }
                  nextCursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createProject
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyInput' } } }
      responses:
        '201':
          description: Created project
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/projects/{projectId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      operationId: getProject
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Project
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateProject
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyInput' } } }
      responses:
        '200':
          description: Updated project
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: archiveProject
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Project archived }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/environments:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      operationId: listEnvironments
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/IncludeArchived' }
      responses:
        '200':
          description: Environments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Environment' } }
                  nextCursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createEnvironment
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyInput' } } }
      responses:
        '201':
          description: Created environment
          content: { application/json: { schema: { $ref: '#/components/schemas/Environment' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/environments/{environmentId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/EnvironmentId' }
    get:
      operationId: getEnvironment
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Environment
          content: { application/json: { schema: { $ref: '#/components/schemas/Environment' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateEnvironment
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyInput' } } }
      responses:
        '200':
          description: Updated environment
          content: { application/json: { schema: { $ref: '#/components/schemas/Environment' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: archiveEnvironment
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Environment archived }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/environments/{environmentId}/apps:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/EnvironmentId' }
    get:
      operationId: listEnvironmentApps
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Apps configured in the Environment
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AppEnvironment' } }
                  nextCursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/apps:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      operationId: listApps
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/IncludeArchived' }
      responses:
        '200':
          description: Apps
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/App' } }
                  nextCursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createApp
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyInput' } } }
      responses:
        '201':
          description: Created app
          content: { application/json: { schema: { $ref: '#/components/schemas/App' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/apps/{appId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/AppId' }
    get:
      operationId: getApp
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: App
          content: { application/json: { schema: { $ref: '#/components/schemas/App' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateApp
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyInput' } } }
      responses:
        '200':
          description: Updated app
          content: { application/json: { schema: { $ref: '#/components/schemas/App' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: archiveApp
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: App archived }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/github/installations/connect:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      operationId: connectGitHubInstallation
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Short-lived GitHub App installation URL
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl: { type: string, format: uri }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/github/installations/callback:
    get:
      operationId: completeGitHubInstallation
      parameters:
        - name: installation_id
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 32, maxLength: 256 }
      responses:
        '302': { description: Continue with GitHub user authorization }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/github/callback:
    get:
      operationId: completeGitHubAuthorization
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 32, maxLength: 256 }
      responses:
        '302': { description: Return to the Console }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/workspaces/{workspaceId}/github/installations:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listGitHubInstallations
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: GitHub App installations connected to the Workspace
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GitHubInstallation' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/workspaces/{workspaceId}/github/installations/{githubInstallationId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/GitHubInstallationId' }
    delete:
      operationId: disconnectGitHubInstallation
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: GitHub App installation disconnected and uninstalled }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/workspaces/{workspaceId}/github/installations/{githubInstallationId}/repositories:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/GitHubInstallationId' }
    get:
      operationId: listGitHubRepositories
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Repositories accessible to the installation
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GitHubRepository' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/apps/{appId}/source:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/AppId' }
    get:
      operationId: getAppSource
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Optional GitHub source configured for the App
          content:
            application/json:
              schema:
                type: object
                required: [source]
                properties:
                  source:
                    oneOf:
                      - { $ref: '#/components/schemas/GitHubSource' }
                      - { type: 'null' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setAppSource
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitHubSourceInput' }
      responses:
        '200':
          description: GitHub source selected for the App
          content: { application/json: { schema: { $ref: '#/components/schemas/GitHubSource' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: clearAppSource
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: GitHub source removed from the App }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/apps/{appId}/builds:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/AppId' }
    get:
      operationId: listAppBuilds
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Builds for the App
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Build' } }
                  nextCursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createAppBuild
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuildInput' }
      responses:
        '202':
          description: Build of the selected branch commit accepted
          content: { application/json: { schema: { $ref: '#/components/schemas/Build' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/apps/{appId}/builds/{buildId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/AppId' }
      - { $ref: '#/components/parameters/BuildId' }
    get:
      operationId: getAppBuild
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Build state
          content: { application/json: { schema: { $ref: '#/components/schemas/Build' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/apps/{appId}/builds/{buildId}/logs:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/AppId' }
      - { $ref: '#/components/parameters/BuildId' }
    get:
      operationId: listAppBuildLogs
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Sanitized bounded build logs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BuildLog' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/apps/{appId}/releases:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/AppId' }
    get:
      operationId: listAppReleases
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Immutable releases for the App
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Release' } }
                  nextCursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/apps/{appId}/environments:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/AppId' }
    get:
      operationId: listAppEnvironments
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Configured Environments for the App
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AppEnvironment' } }
                  nextCursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createAppEnvironment
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AppEnvironmentCreateInput' } } }
      responses:
        '201':
          description: App Environment created
          content: { application/json: { schema: { $ref: '#/components/schemas/AppEnvironment' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/apps/{appId}/environments/{appEnvironmentId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/AppId' }
      - { $ref: '#/components/parameters/AppEnvironmentId' }
    get:
      operationId: getAppEnvironment
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: App Environment
          content: { application/json: { schema: { $ref: '#/components/schemas/AppEnvironment' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateAppEnvironment
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AppEnvironmentInput' } } }
      responses:
        '200':
          description: App Environment updated
          content: { application/json: { schema: { $ref: '#/components/schemas/AppEnvironment' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteAppEnvironment
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '202':
          description: Runtime removal accepted
          content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/apps/{appId}/environments/{appEnvironmentId}/deployments:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/AppId' }
      - { $ref: '#/components/parameters/AppEnvironmentId' }
    get:
      operationId: listAppEnvironmentDeployments
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Immutable Deployment history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Deployment' } }
                  nextCursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createAppEnvironmentDeployment
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentInput' } } }
      responses:
        '202': { $ref: '#/components/responses/MutationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/apps/{appId}/environments/{appEnvironmentId}/deployments/{deploymentId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/AppId' }
      - { $ref: '#/components/parameters/AppEnvironmentId' }
      - { $ref: '#/components/parameters/DeploymentId' }
    get:
      operationId: getAppEnvironmentDeployment
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Immutable Deployment
          content: { application/json: { schema: { $ref: '#/components/schemas/Deployment' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/operations/{operationId}:
    get:
      operationId: getOperation
      security: [{ sessionCookie: [] }]
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string, pattern: '^op-[a-z2-7]{20}$' }
      responses:
        '200':
          description: Operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fruto_session
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IncludeArchived:
      name: includeArchived
      in: query
      schema: { type: boolean, default: false }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, pattern: '^ws-[a-z2-7]{20}$' }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, pattern: '^prj-[a-z2-7]{20}$' }
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema: { type: string, pattern: '^env-[a-z2-7]{20}$' }
    AppId:
      name: appId
      in: path
      required: true
      schema: { type: string, pattern: '^app-[a-z2-7]{20}$' }
    AppEnvironmentId:
      name: appEnvironmentId
      in: path
      required: true
      schema: { type: string, pattern: '^aev-[a-z2-7]{20}$' }
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema: { type: string, pattern: '^dpl-[a-z2-7]{20}$' }
    GitHubInstallationId:
      name: githubInstallationId
      in: path
      required: true
      schema: { type: string, pattern: '^ghi-[a-z2-7]{20}$' }
    BuildId:
      name: buildId
      in: path
      required: true
      schema: { type: string, pattern: '^bld-[a-z2-7]{20}$' }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { type: string, pattern: '^rel-[a-z2-7]{20}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: Authentication required
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated Actor cannot perform this action
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Version or idempotency conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unavailable:
      description: External integration is not configured or unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    MutationAccepted:
      description: Mutation accepted for asynchronous execution
      content:
        application/json:
          schema:
            type: object
            required: [operation]
            properties:
              deployment: { $ref: '#/components/schemas/Deployment' }
              operation: { $ref: '#/components/schemas/Operation' }
  schemas:
    LoginRequest:
      type: object
      required: [actor, password]
      additionalProperties: false
      properties:
        actor: { type: string, enum: [owner, tester-1, tester-2] }
        password: { type: string, minLength: 1, writeOnly: true }
    Session:
      type: object
      required: [actor, csrfToken]
      properties:
        actor:
          type: object
          required: [id, role]
          properties:
            id: { type: string }
            role: { type: string, enum: [owner, tester] }
        csrfToken: { type: string, writeOnly: true }
    Workspace:
      type: object
      required: [id, name, version, state, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^ws-[a-z2-7]{20}$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        version: { type: integer, minimum: 1 }
        state: { type: string, enum: [Pending, Running, Ready, Failed] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    HierarchyInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    Project:
      type: object
      required: [id, name, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^prj-[a-z2-7]{20}$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, 'null'], format: date-time }
    Environment:
      type: object
      required: [id, name, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^env-[a-z2-7]{20}$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, 'null'], format: date-time }
    App:
      type: object
      required: [id, name, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^app-[a-z2-7]{20}$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, 'null'], format: date-time }
    GitHubInstallation:
      type: object
      required: [id, accountLogin, accountType, repositorySelection, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^ghi-[a-z2-7]{20}$' }
        accountLogin: { type: string, minLength: 1 }
        accountType: { type: string, enum: [User, Organization, Enterprise] }
        repositorySelection: { type: string, enum: [all, selected] }
        createdAt: { type: string, format: date-time }
    GitHubRepository:
      type: object
      required: [id, name, fullName, private, defaultBranch]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        name: { type: string, minLength: 1 }
        fullName: { type: string, minLength: 3 }
        private: { type: boolean }
        defaultBranch: { type: string, minLength: 1 }
    GitHubSourceInput:
      type: object
      required: [installationId, repositoryId]
      additionalProperties: false
      properties:
        installationId: { type: string, pattern: '^ghi-[a-z2-7]{20}$' }
        repositoryId: { type: string, pattern: '^[1-9][0-9]*$' }
    GitHubSource:
      type: object
      required: [installationId, repository, connectedAt]
      additionalProperties: false
      properties:
        installationId: { type: string, pattern: '^ghi-[a-z2-7]{20}$' }
        repository: { $ref: '#/components/schemas/GitHubRepository' }
        connectedAt: { type: string, format: date-time }
    BuildInput:
      type: object
      required: [appEnvironmentId]
      additionalProperties: false
      properties:
        appEnvironmentId: { type: string, pattern: '^aev-[a-z2-7]{20}$' }
    Build:
      type: object
      required: [id, projectId, appId, appEnvironmentId, repository, branch, commitSha, platform, status, attempts, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^bld-[a-z2-7]{20}$' }
        projectId: { type: string, pattern: '^prj-[a-z2-7]{20}$' }
        appId: { type: string, pattern: '^app-[a-z2-7]{20}$' }
        appEnvironmentId: { type: string, pattern: '^aev-[a-z2-7]{20}$' }
        repository: { type: string, minLength: 3 }
        branch: { type: string, minLength: 1, maxLength: 255 }
        commitSha: { type: string, pattern: '^[a-f0-9]{40}$' }
        platform: { type: string, enum: [linux/amd64] }
        status: { type: string, enum: [Pending, Running, Succeeded, Failed] }
        attempts: { type: integer, minimum: 0, maximum: 3 }
        errorCode: { type: string }
        errorMessage: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BuildLog:
      type: object
      required: [sequence, message, createdAt]
      additionalProperties: false
      properties:
        sequence: { type: integer, minimum: 1 }
        message: { type: string, minLength: 1, maxLength: 4000 }
        createdAt: { type: string, format: date-time }
    Release:
      type: object
      required: [id, projectId, appId, buildId, branch, commitSha, image, platform, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^rel-[a-z2-7]{20}$' }
        projectId: { type: string, pattern: '^prj-[a-z2-7]{20}$' }
        appId: { type: string, pattern: '^app-[a-z2-7]{20}$' }
        buildId: { type: string, pattern: '^bld-[a-z2-7]{20}$' }
        branch: { type: string, minLength: 1, maxLength: 255 }
        commitSha: { type: string, pattern: '^[a-f0-9]{40}$' }
        image: { type: string, pattern: '^[a-z0-9][a-z0-9._:/-]*@sha256:[a-f0-9]{64}$' }
        platform: { type: string, enum: [linux/amd64] }
        createdAt: { type: string, format: date-time }
    Variable:
      type: object
      required: [name, value]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 253, pattern: '^[A-Za-z_][A-Za-z0-9_]*$' }
        value: { type: string, maxLength: 4096 }
    RuntimeConfiguration:
      type: object
      required: [replicas, port, resources, probes, exposure, variables]
      additionalProperties: false
      properties:
        replicas: { type: integer, minimum: 1, maximum: 5, default: 1 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        resources:
          type: object
          required: [requests, limits]
          additionalProperties: false
          properties:
            requests: { $ref: '#/components/schemas/ResourceValues' }
            limits: { $ref: '#/components/schemas/ResourceValues' }
        probes:
          type: object
          required: [liveness, readiness]
          additionalProperties: false
          properties:
            liveness: { $ref: '#/components/schemas/Probe' }
            readiness: { $ref: '#/components/schemas/Probe' }
        exposure: { type: string, enum: [Private, Public], default: Private }
        slug: { type: string, maxLength: 63, pattern: '^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$' }
        variables:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Variable' }
    AppEnvironmentInput:
      type: object
      required: [branch, configuration]
      additionalProperties: false
      properties:
        branch: { type: string, minLength: 1, maxLength: 255 }
        configuration: { $ref: '#/components/schemas/RuntimeConfiguration' }
    AppEnvironmentCreateInput:
      type: object
      required: [environmentId, branch, configuration]
      additionalProperties: false
      properties:
        environmentId: { type: string, pattern: '^env-[a-z2-7]{20}$' }
        branch: { type: string, minLength: 1, maxLength: 255 }
        configuration: { $ref: '#/components/schemas/RuntimeConfiguration' }
    AppEnvironment:
      type: object
      required: [id, projectId, appId, appName, environmentId, environmentName, branch, configuration, configurationVersion, version, state, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^aev-[a-z2-7]{20}$' }
        projectId: { type: string, pattern: '^prj-[a-z2-7]{20}$' }
        appId: { type: string, pattern: '^app-[a-z2-7]{20}$' }
        appName: { type: string, minLength: 1, maxLength: 80 }
        environmentId: { type: string, pattern: '^env-[a-z2-7]{20}$' }
        environmentName: { type: string, minLength: 1, maxLength: 80 }
        branch: { type: string, minLength: 1, maxLength: 255 }
        configuration: { $ref: '#/components/schemas/RuntimeConfiguration' }
        configurationVersion: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
        desiredDeploymentId: { type: string, pattern: '^dpl-[a-z2-7]{20}$' }
        currentDeploymentId: { type: string, pattern: '^dpl-[a-z2-7]{20}$' }
        currentReleaseId: { type: string, pattern: '^rel-[a-z2-7]{20}$' }
        state: { type: string, enum: [Pending, Progressing, Ready, Degraded, Unknown] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DeploymentInput:
      type: object
      required: [releaseId]
      additionalProperties: false
      properties:
        releaseId: { type: string, pattern: '^rel-[a-z2-7]{20}$' }
    ResourceValues:
      type: object
      required: [cpuMillis, memoryMiB]
      additionalProperties: false
      properties:
        cpuMillis: { type: integer, minimum: 1, maximum: 2000 }
        memoryMiB: { type: integer, minimum: 1, maximum: 2048 }
    Probe:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string, maxLength: 2048, pattern: '^/' }
    Deployment:
      type: object
      required: [id, appEnvironmentId, releaseId, configurationVersion, configuration, state, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^dpl-[a-z2-7]{20}$' }
        appEnvironmentId: { type: string, pattern: '^aev-[a-z2-7]{20}$' }
        releaseId: { type: string, pattern: '^rel-[a-z2-7]{20}$' }
        configurationVersion: { type: integer, minimum: 1 }
        configuration: { $ref: '#/components/schemas/RuntimeConfiguration' }
        state: { type: string, enum: [Pending, Progressing, Ready, Degraded] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Operation:
      type: object
      required: [id, kind, status, desiredVersion, attempts]
      properties:
        id: { type: string, pattern: '^op-' }
        appEnvironmentId: { type: string, pattern: '^aev-[a-z2-7]{20}$' }
        deploymentId: { type: string, pattern: '^dpl-[a-z2-7]{20}$' }
        kind: { type: string, enum: [ApplyDeployment, DeleteAppEnvironment, EnsureWorkspace] }
        status: { type: string, enum: [Pending, Running, Succeeded, Failed] }
        desiredVersion: { type: integer, minimum: 1 }
        attempts: { type: integer, minimum: 0 }
        errorCode: { type: string }
        errorMessage: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
