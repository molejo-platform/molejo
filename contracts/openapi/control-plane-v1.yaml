        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step: { type: string }
        resolutionSeconds: { type: integer, minimum: 15, maximum: 3600 }
        partial: { type: boolean }
        unavailable: { type: array, items: { type: string, enum: [cpu, memory, restarts, available, desired] } }
        series: { type: array, items: { $ref: '#/components/schemas/RuntimeMetricSeries' } }
    RuntimeMetricSample:
      type: object
      required: [name, unit, timestamp, value]
      additionalProperties: false
      properties:
        name: { type: string, enum: [cpu, memory, restarts, available, desired] }
        unit: { type: string, enum: [cores, bytes, count, replicas] }
        timestamp: { type: string, format: date-time }
        value: { type: number }
    RuntimeMetricSnapshot:
      type: object
      required: [observedAt, partial, unavailable, samples]
      additionalProperties: false
      properties:
        observedAt: { type: string, format: date-time }
        partial: { type: boolean }
        unavailable: { type: array, items: { type: string, enum: [cpu, memory, restarts, available, desired] } }
        samples: { type: array, items: { $ref: '#/components/schemas/RuntimeMetricSample' } }
    RuntimeEvent:
      type: object
