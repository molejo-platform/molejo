syntax = "proto3";

package molejo.clusteragent.v1alpha1;

option go_package = "github.com/molejo-platform/molejo/contracts/molejo/clusteragent/v1alpha1;clusteragentv1alpha1";

service ClusterAgentService {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
}

message ConnectRequest {
  oneof payload {
    AgentHello hello = 1;
    Heartbeat heartbeat = 2;
    RuntimeResult runtime_result = 3;
  }
}

message ConnectResponse {
  oneof payload {
    ControlPlaneHello hello = 1;
    HeartbeatAck heartbeat_ack = 2;
    RuntimeCommand runtime_command = 3;
  }
}

message AgentHello {
  string installation_id = 1;
  string agent_version = 2;
  string cluster_uid = 3;
  string kubernetes_version = 4;
  repeated string capabilities = 5;
  repeated string supported_protocol_versions = 6;
}

message ControlPlaneHello {
  string protocol_version = 1;
  int32 heartbeat_interval_seconds = 2;
  int64 server_time_unix = 3;
  repeated string capabilities = 4;
}

message Heartbeat {
  uint64 sequence = 1;
  int64 sent_at_unix = 2;
  repeated RuntimeObservation observations = 3;
  bool observation_snapshot_complete = 4;
}

message RuntimeObservation {
  string kind = 1;
  string namespace = 2;
  string name = 3;
  string state = 4;
  string message = 5;
  int64 generation = 6;
  int64 observed_generation = 7;
  string observed_release = 8;
  int64 observed_size_gib = 9;
}

message HeartbeatAck {
  uint64 sequence = 1;
  int64 received_at_unix = 2;
}

message RuntimeCommand {
  string command_id = 1;
  string operation_id = 2;
  int64 desired_version = 3;
  int64 fencing_token = 4;
  int64 deadline_unix = 5;
  string kind = 6;
  bytes payload_json = 7;
  string payload_schema_version = 8;
}

message RuntimeResult {
  string command_id = 1;
  int64 fencing_token = 2;
  string state = 3;
  string message = 4;
  string observed_release = 5;
  string volume_state = 6;
  string volume_message = 7;
  int64 observed_size_gib = 8;
  string error_code = 9;
  bool retryable = 10;
}

message RenewCertificateRequest {
  string installation_id = 1;
  string attempt_id = 2;
  bytes csr_pem = 3;
}

message RenewCertificateResponse {
  string installation_id = 1;
  bytes certificate_pem = 2;
  bytes ca_certificate_pem = 3;
  int64 expires_at_unix = 4;
  bytes server_ca_certificate_pem = 5;
}
