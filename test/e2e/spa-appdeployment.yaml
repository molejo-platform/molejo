apiVersion: platform.fruto.calouro.tech/v1alpha1
kind: AppDeployment
metadata:
  name: ap-spa000001
  namespace: ws-spa-e2e
spec:
  image: __SPA_IMAGE__
  port: 8080
  resources:
    requests:
      cpuMillis: 10
      memoryMiB: 16
    limits:
      cpuMillis: 100
      memoryMiB: 64
  probes:
    liveness:
      path: /healthz
    readiness:
      path: /readyz
  exposure: Public
  slug: spa-e2e
