apiVersion: platform.fruto.calouro.tech/v1alpha1
kind: AppDeployment
metadata:
  name: ap-e2e000001
  namespace: ws-e2e
spec:
  workload:
    kind: Stateless
    stateless: {}
  image: __APP_IMAGE__
  port: 8080
  resources:
    requests:
      cpuMillis: 25
      memoryMiB: 32
    limits:
      cpuMillis: 250
      memoryMiB: 96
  probes:
    liveness:
      path: /healthz
    readiness:
      path: /readyz
