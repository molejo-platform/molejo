apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: control-plane-console
  namespace: fruto-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: fruto-control-plane
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: control-plane-console
  namespace: fruto-control-plane
spec:
  parentRefs:
    - name: fruto
      namespace: fruto-system
      sectionName: https-molejo
  hostnames:
    - cloud.molejo.dev
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: control-plane-api
          port: 8080
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: console-web
          port: 8080
