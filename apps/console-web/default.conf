server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /healthz { access_log off; default_type text/plain; add_header Cache-Control "no-store" always; return 200 "ok\n"; }
    location = /readyz { access_log off; default_type text/plain; add_header Cache-Control "no-store" always; return 200 "ready\n"; }
    location ^~ /api/ {
        proxy_pass https://control-plane-api.molejo-control-plane.svc.cluster.local:8444;
        proxy_http_version 1.1;
        proxy_ssl_trusted_certificate /var/run/secrets/molejo/api-ca/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name control-plane-api.molejo-control-plane.svc.cluster.local;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~ \.[^/]+$ { try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache" always; }
}
