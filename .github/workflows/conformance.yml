name: Conformance

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/workflows/conformance.yml"
      - "apps/molejoctl/**"
      - "contracts/**"
      - "deploy/**"
      - "packages/**"
      - "services/**"
      - "test/fixtures/conformance-http/**"
      - "tools/cmd/conformance-bundle/**"
      - "tools/cmd/molejo-conformance/**"
      - "tools/internal/conformance/**"
      - "tools/testing/kind-conformance.sh"
      - "go.mod"
      - "go.sum"
      - "tools/go.mod"
      - "tools/go.sum"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kind:
    name: Kind alpha profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      MOLEJO_CONFORMANCE_OUTPUT_DIR: ${{ runner.temp }}/molejo-conformance
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Run disposable Kind conformance
        timeout-minutes: 40
        run: tools/testing/kind-conformance.sh

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kind-conformance-${{ github.run_id }}
          path: ${{ env.MOLEJO_CONFORMANCE_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 14
