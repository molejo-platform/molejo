name: Bug report
description: Report a reproducible defect in Fruto Platform.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Fruto Platform is pre-alpha. Reports are welcome in English, Portuguese, or Spanish.
        For security vulnerabilities, use private vulnerability reporting instead of this form.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
  - type: input
    attributes:
      label: Revision
      description: Commit SHA, branch, or image tag where the problem occurs.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest sequence of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant evidence
      description: Add sanitized logs, screenshots, manifests, or other useful context.
